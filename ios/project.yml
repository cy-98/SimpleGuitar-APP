name: ScalePulse
options:
  bundleIdPrefix: app.scalepulse
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
targets:
  ScalePulse:
    type: application
    platform: iOS
    sources:
      - ScalePulse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.scalepulse.mobile
        INFOPLIST_KEY_CFBundleDisplayName: Jita
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Jita uses the microphone to detect pitch for guitar tuning.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
  ScalePulseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ScalePulseTests
    dependencies:
      - target: ScalePulse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.scalepulse.mobile.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  ScalePulse:
    build:
      targets:
        ScalePulse: all
        ScalePulseTests: [test]
    test:
      targets:
        - ScalePulseTests
